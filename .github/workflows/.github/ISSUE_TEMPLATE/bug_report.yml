name: Fehlerbericht
description: Einen reproduzierbaren Fehler im MB-Secure ioBroker Projekt melden
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Danke für den Fehlerbericht.

        Bitte veröffentliche hier keine Zugangsdaten, Passwörter,
        privaten IP-Adressen, Seriennummern oder andere sensible Daten.

  - type: textarea
    id: description
    attributes:
      label: Fehlerbeschreibung
      description: Was ist passiert und was wurde erwartet?
      placeholder: Beschreibe den Fehler möglichst genau.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Schritte zur Reproduktion
      description: Wie lässt sich der Fehler reproduzieren?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: panel_version
    attributes:
      label: MB-Secure Firmware
      description: Firmware-Version der Zentrale, sofern bekannt.
      placeholder: "z. B. EMBSC.00.0V12.55"

  - type: input
    id: iobroker
    attributes:
      label: ioBroker / JavaScript-Adapter
      description: Verwendete Versionen, sofern bekannt.

  - type: textarea
    id: logs
    attributes:
      label: Relevante Logs
      description: |
        Bitte Zugangsdaten, IP-Adressen, Seriennummern und andere
        persönliche oder sicherheitsrelevante Informationen entfernen.
      render: shell

  - type: checkboxes
    id: security
    attributes:
      label: Datenschutz und Sicherheit
      options:
        - label: Ich habe die Angaben auf Passwörter, Zugangsdaten und andere sensible Informationen geprüft.
          required: true
